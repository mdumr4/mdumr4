<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBgWide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <pattern id="cardGridWide" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
  </style>

  <!-- Card Surface -->
  <rect x="2" y="2" width="1176" height="196" rx="12" fill="url(#cardBgWide)" stroke="#1e293b" stroke-width="1.2" />
  <rect x="3" y="3" width="1174" height="194" rx="11" fill="url(#cardGridWide)" />

  <!-- Top Accent Line (Mint & Amber) -->
  <path d="M 2 14 Q 2 2 14 2 L 160 2" fill="none" stroke="#00f5a0" stroke-width="2.5" />

  <!-- Category & Metric Row -->
  <g transform="translate(24, 26)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="190" height="24" rx="4" fill="#0b1a15" stroke="#00f5a0" stroke-opacity="0.4" stroke-width="1" />
    <text x="10" y="16" fill="#00f5a0" class="mono" font-size="10.5" font-weight="700">BIG DATA &amp; RECORD LINKAGE</text>

    <!-- Highlight Metric Pill -->
    <g transform="translate(980, 0)">
      <rect x="0" y="0" width="150" height="24" rx="12" fill="#0b1a15" stroke="#00f5a0" stroke-width="1" />
      <text x="12" y="16.5" fill="#00f5a0" class="mono" font-size="11.5" font-weight="800">&gt; 99.1% RECALL</text>
    </g>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(24, 76)">
    <text x="0" y="0" fill="#ffffff" class="sans" font-size="22" font-weight="800">Business-Entity-Resolution</text>
    <text x="320" y="-3" fill="#64748b" class="mono" font-size="11">MILLION-SCALE MERCHANT DEDUPLICATION</text>
  </g>

  <!-- Description Body -->
  <g transform="translate(24, 108)">
    <text x="0" y="0" fill="#94a3b8" class="sans" font-size="13.5" font-weight="400">
      Scalable record linkage pipeline: TF-IDF n-gram inverted index blocking prunes candidate pairs by 99.8%,
    </text>
    <text x="0" y="20" fill="#94a3b8" class="sans" font-size="13.5" font-weight="400">
      verified with vectorized Levenshtein edit distance matrices and a boosted classification reranker across 1M+ entities.
    </text>
  </g>

  <!-- Tech Tags & Action Strip -->
  <g transform="translate(24, 158)">
    <rect x="0" y="0" width="68" height="22" rx="4" fill="#131926" stroke="#243045" stroke-width="1" />
    <text x="8" y="15" fill="#cbd5e1" class="mono" font-size="10.5">Python</text>

    <rect x="76" y="0" width="94" height="22" rx="4" fill="#131926" stroke="#243045" stroke-width="1" />
    <text x="84" y="15" fill="#cbd5e1" class="mono" font-size="10.5">Scikit-Learn</text>

    <rect x="178" y="0" width="155" height="22" rx="4" fill="#131926" stroke="#243045" stroke-width="1" />
    <text x="186" y="15" fill="#cbd5e1" class="mono" font-size="10.5">Inverted Index Blocking</text>

    <rect x="341" y="0" width="145" height="22" rx="4" fill="#131926" stroke="#243045" stroke-width="1" />
    <text x="349" y="15" fill="#cbd5e1" class="mono" font-size="10.5">Levenshtein Matrices</text>

    <rect x="494" y="0" width="115" height="22" rx="4" fill="#131926" stroke="#243045" stroke-width="1" />
    <text x="502" y="15" fill="#cbd5e1" class="mono" font-size="10.5">Snappy Parquet</text>

    <text x="860" y="16" fill="#00f5a0" class="mono" font-size="11.5" font-weight="600">Explore Deduplication Pipeline →</text>
  </g>
</svg>

