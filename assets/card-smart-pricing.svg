<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 270" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <pattern id="cardGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
  </style>

  <!-- Card Surface -->
  <rect x="2" y="2" width="576" height="266" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />
  <rect x="3" y="3" width="574" height="264" rx="11" fill="url(#cardGrid)" />

  <!-- Top Accent Line -->
  <path d="M 2 14 Q 2 2 14 2 L 120 2" fill="none" stroke="#f59e0b" stroke-width="2.5" />

  <!-- Category & Metric Row -->
  <g transform="translate(24, 28)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="170" height="24" rx="4" fill="#1c1608" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
    <text x="10" y="16" fill="#f59e0b" class="mono" font-size="10.5" font-weight="700">AMAZON ML CHALLENGE</text>

    <!-- Highlight Metric Pill -->
    <g transform="translate(410, 0)">
      <rect x="0" y="0" width="118" height="24" rx="12" fill="#1c1608" stroke="#f59e0b" stroke-width="1" />
      <text x="12" y="16.5" fill="#f59e0b" class="mono" font-size="12" font-weight="800">0.380 RMSLE</text>
    </g>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(24, 82)">
    <text x="0" y="0" fill="#ffffff" class="sans" font-size="22" font-weight="800">Smart-Product-Pricing</text>
    <text x="0" y="20" fill="#64748b" class="mono" font-size="11">DUAL-TOWER MULTIMODAL PRICING PIPELINE</text>
  </g>

  <!-- Description Body -->
  <g transform="translate(24, 130)">
    <text x="0" y="0" fill="#94a3b8" class="sans" font-size="13.5" font-weight="400">
      Fuses DistilBERT text embeddings with DINOv2 self-supervised visual
    </text>
    <text x="0" y="20" fill="#94a3b8" class="sans" font-size="13.5" font-weight="400">
      features via cross-attention, streamed through Snappy Parquet into LightGBM.
    </text>
  </g>

  <!-- Tech Tags -->
  <g transform="translate(24, 185)">
    <rect x="0" y="0" width="68" height="22" rx="4" fill="#131926" stroke="#243045" stroke-width="1" />
    <text x="8" y="15" fill="#cbd5e1" class="mono" font-size="10.5">PyTorch</text>

    <rect x="76" y="0" width="94" height="22" rx="4" fill="#131926" stroke="#243045" stroke-width="1" />
    <text x="84" y="15" fill="#cbd5e1" class="mono" font-size="10.5">DINOv2 ViT</text>

    <rect x="178" y="0" width="78" height="22" rx="4" fill="#131926" stroke="#243045" stroke-width="1" />
    <text x="186" y="15" fill="#cbd5e1" class="mono" font-size="10.5">DistilBERT</text>

    <rect x="264" y="0" width="76" height="22" rx="4" fill="#131926" stroke="#243045" stroke-width="1" />
    <text x="272" y="15" fill="#cbd5e1" class="mono" font-size="10.5">LightGBM</text>

    <rect x="348" y="0" width="68" height="22" rx="4" fill="#131926" stroke="#243045" stroke-width="1" />
    <text x="356" y="15" fill="#cbd5e1" class="mono" font-size="10.5">Parquet</text>
  </g>

  <!-- Bottom Action Strip -->
  <g transform="translate(24, 238)">
    <text x="0" y="0" fill="#f59e0b" class="mono" font-size="11.5" font-weight="600">Explore Architecture &amp; Benchmark Data →</text>
  </g>
</svg>

