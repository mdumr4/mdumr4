<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 270" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <pattern id="cardGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
  </style>

  <!-- Card Surface -->
  <rect x="2" y="2" width="576" height="266" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />
  <rect x="3" y="3" width="574" height="264" rx="11" fill="url(#cardGrid)" />

  <!-- Top Accent Line (Mint) -->
  <path d="M 2 14 Q 2 2 14 2 L 120 2" fill="none" stroke="#00f5a0" stroke-width="2.5" />

  <!-- Category & Metric Row -->
  <g transform="translate(24, 28)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="190" height="24" rx="4" fill="#0b1a15" stroke="#00f5a0" stroke-opacity="0.4" stroke-width="1" />
    <text x="10" y="16" fill="#00f5a0" class="mono" font-size="10.5" font-weight="700">TWO-STAGE HYBRID RAG</text>

    <!-- Highlight Metric Pill -->
    <g transform="translate(378, 0)">
      <rect x="0" y="0" width="150" height="24" rx="12" fill="#0b1a15" stroke="#00f5a0" stroke-width="1" />
      <text x="12" y="16.5" fill="#00f5a0" class="mono" font-size="11.5" font-weight="800">100% EXPLAINABLE</text>
    </g>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(24, 82)">
    <text x="0" y="0" fill="#ffffff" class="sans" font-size="22" font-weight="800">resume-ranker</text>
    <text x="0" y="20" fill="#64748b" class="mono" font-size="11">NEURAL SEARCH &amp; EXPLAINABLE RERANKING</text>
  </g>

  <!-- Description Body -->
  <g transform="translate(24, 130)">
    <text x="0" y="0" fill="#94a3b8" class="sans" font-size="13.5" font-weight="400">
      Fuses dense FAISS vector search with learned sparse SPLADE-v3 expansions,
    </text>
    <text x="0" y="20" fill="#94a3b8" class="sans" font-size="13.5" font-weight="400">
      calibrated Cross-Encoder reranking, and grounded Qwen 2.5 synthesis.
    </text>
  </g>

  <!-- Tech Tags -->
  <g transform="translate(24, 185)">
    <rect x="0" y="0" width="92" height="22" rx="4" fill="#131926" stroke="#243045" stroke-width="1" />
    <text x="8" y="15" fill="#cbd5e1" class="mono" font-size="10.5">FAISS HNSW</text>

    <rect x="100" y="0" width="86" height="22" rx="4" fill="#131926" stroke="#243045" stroke-width="1" />
    <text x="108" y="15" fill="#cbd5e1" class="mono" font-size="10.5">SPLADE-v3</text>

    <rect x="194" y="0" width="108" height="22" rx="4" fill="#131926" stroke="#243045" stroke-width="1" />
    <text x="202" y="15" fill="#cbd5e1" class="mono" font-size="10.5">Cross-Encoder</text>

    <rect x="310" y="0" width="78" height="22" rx="4" fill="#131926" stroke="#243045" stroke-width="1" />
    <text x="318" y="15" fill="#cbd5e1" class="mono" font-size="10.5">Qwen 2.5</text>

    <rect x="396" y="0" width="66" height="22" rx="4" fill="#131926" stroke="#243045" stroke-width="1" />
    <text x="404" y="15" fill="#cbd5e1" class="mono" font-size="10.5">FastAPI</text>
  </g>

  <!-- Bottom Action Strip -->
  <g transform="translate(24, 238)">
    <text x="0" y="0" fill="#00f5a0" class="mono" font-size="11.5" font-weight="600">Explore Retrieval Pipeline &amp; Reranker →</text>
  </g>
</svg>

