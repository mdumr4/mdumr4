<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 150" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f17" />
      <stop offset="100%" stop-color="#06080c" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Terminal Window Surface -->
  <rect x="2" y="2" width="1176" height="146" rx="10" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Window Header -->
  <g transform="translate(16, 16)">
    <circle cx="0" cy="0" r="4.5" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="15" cy="0" r="4.5" fill="#f59e0b" fill-opacity="0.8" />
    <circle cx="30" cy="0" r="4.5" fill="#10b981" fill-opacity="0.8" />
    <text x="50" y="4" fill="#64748b" class="mono" font-size="11">bash — 80x24</text>
  </g>

  <!-- Command Line -->
  <g transform="translate(20, 52)">
    <text x="0" y="0" fill="#00f5a0" class="mono" font-size="12" font-weight="700">❯</text>
    <text x="16" y="0" fill="#f1f5f9" class="mono" font-size="12">curl -s https://api.umar.dev/contact | jq .</text>
  </g>

  <!-- Terminal Response -->
  <g transform="translate(20, 80)">
    <text x="0" y="0" fill="#64748b" class="mono" font-size="11.5">{</text>
    <text x="18" y="0" fill="#94a3b8" class="mono" font-size="11.5">"email":</text>
    <text x="80" y="0" fill="#f59e0b" class="mono" font-size="11.5">"mdumr4@gmail.com"</text>
    <text x="230" y="0" fill="#64748b" class="mono" font-size="11.5">,</text>

    <text x="250" y="0" fill="#94a3b8" class="mono" font-size="11.5">"linkedin":</text>
    <text x="325" y="0" fill="#00f5a0" class="mono" font-size="11.5">"in/mohammed-umar-f"</text>
    <text x="495" y="0" fill="#64748b" class="mono" font-size="11.5">,</text>

    <text x="515" y="0" fill="#94a3b8" class="mono" font-size="11.5">"status":</text>
    <text x="580" y="0" fill="#f59e0b" class="mono" font-size="11.5">"Available for Senior AI Roles"</text>
    <text x="825" y="0" fill="#64748b" class="mono" font-size="11.5">}</text>
  </g>

  <!-- Prompt Cursor -->
  <g transform="translate(20, 115)">
    <text x="0" y="0" fill="#00f5a0" class="mono" font-size="12" font-weight="700">❯</text>
    <rect x="16" y="-10" width="8" height="13" fill="#00f5a0" fill-opacity="0.8" />
  </g>
</svg>

