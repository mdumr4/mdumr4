<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 195" width="100%" height="100%">
  <defs>
    <!-- Seamless GitHub Dark Canvas -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>

    <!-- Subtle Technical Grid -->
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#21262d" stroke-width="0.7" stroke-opacity="0.6" />
    </pattern>

    <!-- Ambient Emerald Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes liveBlink {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
    .live-pulse { animation: liveBlink 2.5s infinite ease-in-out; transform-origin: center; }
    .mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
  </style>

  <!-- Base Card Frame -->
  <rect x="1" y="1" width="898" height="193" rx="10" fill="url(#bgCanvas)" stroke="#30363d" stroke-width="1.2" />

  <!-- Grid Overlay -->
  <rect x="2" y="2" width="896" height="191" rx="9" fill="url(#gridPattern)" />

  <!-- Ambient Glow in Top Right -->
  <circle cx="820" cy="50" r="110" fill="#10b981" fill-opacity="0.08" filter="url(#emeraldGlow)" />

  <!-- ================= TOP TERMINAL CONTROL BAR ================= -->
  <g transform="translate(20, 18)">
    <!-- Terminal Dots -->
    <circle cx="0" cy="0" r="4.5" fill="#ff5f56" />
    <circle cx="15" cy="0" r="4.5" fill="#ffbd2e" />
    <circle cx="30" cy="0" r="4.5" fill="#27c93f" />

    <!-- Terminal Breadcrumb -->
    <text x="50" y="4" fill="#8b949e" class="mono" font-size="11.5">~/mohammed-umar-f (ai-systems) ⎇ main</text>

    <!-- Live Status Pill -->
    <g transform="translate(640, -10)">
      <rect x="0" y="0" width="200" height="22" rx="11" fill="#161b22" stroke="#238636" stroke-width="1" />
      <circle cx="12" cy="11" r="3.5" fill="#2ea043" class="live-pulse" />
      <text x="24" y="15" fill="#3fb950" class="mono" font-size="10.5" font-weight="600">OPEN TO SENIOR AI ROLES</text>
    </g>

    <!-- Top Hairline Divider -->
    <line x1="-4" y1="16" x2="864" y2="16" stroke="#21262d" stroke-width="1" />
  </g>

  <!-- ================= HERO IDENTITY & VALUE ================= -->
  <g transform="translate(32, 72)">
    <!-- Role Tag -->
    <text x="0" y="0" fill="#10b981" class="mono" font-size="11.5" font-weight="700" letter-spacing="1.2">AI SYSTEMS ARCHITECT &amp; MULTIMODAL ENGINEER</text>

    <!-- Main Name -->
    <text x="0" y="42" fill="#ffffff" class="sans" font-size="38" font-weight="800" letter-spacing="-0.8px">Mohammed Umar F</text>

    <!-- Value Statement -->
    <text x="0" y="74" fill="#8b949e" class="sans" font-size="14.5" font-weight="400">
      Engineering high-throughput vision-language models, two-stage hybrid RAG pipelines,
    </text>
    <text x="0" y="96" fill="#8b949e" class="sans" font-size="14.5" font-weight="400">
      and stealth autonomous browser agents designed for real-world scale and zero hallucination.
    </text>
  </g>
</svg>
