<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="100%" height="100%">
  <defs>
    <!-- Obsidian & Carbon Gradient Canvas -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="50%" stop-color="#0d1017" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Razor Hairline Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#22c55e" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glass HUD Panel Background -->
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121620" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0b0e14" stop-opacity="0.95" />
    </linearGradient>

    <!-- Titanium Heading Text -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="glowMint" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Architectural Dot Grid Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseLive {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.4); opacity: 1; }
    }
    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(370px); }
    }
    .live-dot { animation: pulseLive 2.2s infinite ease-in-out; transform-origin: center; }
    .mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
    .f-heavy { font-weight: 800; letter-spacing: -0.8px; }
    .f-medium { font-weight: 600; letter-spacing: 0.5px; }
  </style>

  <!-- Base Canvas Surface -->
  <rect x="2" y="2" width="1196" height="366" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.4" />

  <!-- Background Technical Dot Grid -->
  <rect x="3" y="3" width="1194" height="364" rx="15" fill="url(#dotGrid)" />

  <!-- Radial Glow Accents (Mint and Amber only) -->
  <circle cx="950" cy="90" r="160" fill="#00f5a0" fill-opacity="0.06" filter="url(#glowMint)" />
  <circle cx="110" cy="300" r="130" fill="#f59e0b" fill-opacity="0.04" filter="url(#glowAmber)" />

  <!-- ================= TOP HUD TERMINAL BAR ================= -->
  <g transform="translate(24, 20)">
    <!-- Terminal Window Controls -->
    <circle cx="8" cy="8" r="5" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="26" cy="8" r="5" fill="#f59e0b" fill-opacity="0.8" />
    <circle cx="44" cy="8" r="5" fill="#10b981" fill-opacity="0.8" />

    <!-- Terminal Breadcrumb -->
    <text x="68" y="12" fill="#64748b" class="mono" font-size="12">system://portfolio/mohammed-umar-f.ai</text>

    <!-- Top Right Live Status Pill -->
    <g transform="translate(930, -3)">
      <rect x="0" y="0" width="215" height="24" rx="12" fill="#101826" stroke="#00f5a0" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="12" cy="12" r="3.5" fill="#00f5a0" class="live-dot" />
      <text x="24" y="16" fill="#00f5a0" class="mono" font-size="10.5" font-weight="600">STATUS: OPEN FOR AI ROLES</text>
    </g>

    <!-- Subtle Divider Line -->
    <line x1="0" y1="26" x2="1148" y2="26" stroke="#1e293b" stroke-width="1" stroke-opacity="0.7" />
  </g>

  <!-- ================= LEFT IDENTITY COLUMN ================= -->
  <g transform="translate(48, 86)">
    <!-- Discipline Tag -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="275" height="24" rx="4" fill="#0d1b18" stroke="#00f5a0" stroke-opacity="0.4" stroke-width="1" />
      <text x="10" y="16" fill="#00f5a0" class="mono" font-size="11" font-weight="600">AI SYSTEMS &amp; MULTIMODAL ML</text>
    </g>

    <!-- Main Name -->
    <text x="0" y="70" fill="url(#nameGrad)" class="sans f-heavy" font-size="46">Mohammed Umar F</text>

    <!-- Value Statement -->
    <text x="0" y="106" fill="#94a3b8" class="sans" font-size="15" font-weight="400">
      Engineering production-grade intelligence: multimodal vision-language architectures,
    </text>
    <text x="0" y="128" fill="#94a3b8" class="sans" font-size="15" font-weight="400">
      two-stage hybrid RAG engines, and autonomous browser agents built for real scale.
    </text>

    <!-- Hardware / Interactive Button Chips -->
    <g transform="translate(0, 168)">
      <!-- Chip 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="30" rx="5" fill="#10141e" stroke="#334155" stroke-width="1" />
        <circle cx="14" cy="15" r="3" fill="#00f5a0" />
        <text x="26" y="19" fill="#e2e8f0" class="mono" font-size="11" font-weight="500">Multimodal Fusion</text>
      </g>

      <!-- Chip 2 -->
      <g transform="translate(178, 0)">
        <rect x="0" y="0" width="168" height="30" rx="5" fill="#10141e" stroke="#334155" stroke-width="1" />
        <circle cx="14" cy="15" r="3" fill="#f59e0b" />
        <text x="26" y="19" fill="#e2e8f0" class="mono" font-size="11" font-weight="500">Two-Stage RAG</text>
      </g>

      <!-- Chip 3 -->
      <g transform="translate(356, 0)">
        <rect x="0" y="0" width="176" height="30" rx="5" fill="#10141e" stroke="#334155" stroke-width="1" />
        <circle cx="14" cy="15" r="3" fill="#00f5a0" />
        <text x="26" y="19" fill="#e2e8f0" class="mono" font-size="11" font-weight="500">1M+ Entity Linkage</text>
      </g>

      <!-- Chip 4 -->
      <g transform="translate(542, 0)">
        <rect x="0" y="0" width="160" height="30" rx="5" fill="#10141e" stroke="#334155" stroke-width="1" />
        <circle cx="14" cy="15" r="3" fill="#f59e0b" />
        <text x="26" y="19" fill="#e2e8f0" class="mono" font-size="11" font-weight="500">Autonomous MV3</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT TELEMETRY HUD ================= -->
  <g transform="translate(775, 78)">
    <!-- HUD Container Glass Card -->
    <rect x="0" y="0" width="375" height="248" rx="10" fill="url(#hudBg)" stroke="#1e293b" stroke-width="1.2" />

    <!-- Corner Accents -->
    <path d="M 0 12 L 0 0 L 12 0" fill="none" stroke="#00f5a0" stroke-width="1.5" />
    <path d="M 363 0 L 375 0 L 375 12" fill="none" stroke="#00f5a0" stroke-width="1.5" />
    <path d="M 0 236 L 0 248 L 12 248" fill="none" stroke="#00f5a0" stroke-width="1.5" />
    <path d="M 363 248 L 375 248 L 375 236" fill="none" stroke="#00f5a0" stroke-width="1.5" />

    <!-- HUD Header -->
    <g transform="translate(16, 18)">
      <text x="0" y="0" fill="#64748b" class="mono" font-size="10" font-weight="700" letter-spacing="1.2">SYSTEM TELEMETRY &amp; BENCHMARKS</text>
      <circle cx="330" cy="-4" r="3" fill="#10b981" />
    </g>

    <!-- Metric Row 1: Amazon ML Challenge -->
    <g transform="translate(16, 36)">
      <rect x="0" y="0" width="343" height="38" rx="6" fill="#080b12" stroke="#172030" stroke-width="1" />
      <text x="12" y="24" fill="#94a3b8" class="mono" font-size="11">Amazon ML Challenge</text>
      <text x="245" y="24" fill="#f59e0b" class="mono" font-size="12" font-weight="700">0.380 RMSLE</text>
    </g>

    <!-- Metric Row 2: Infosys Springboard -->
    <g transform="translate(16, 82)">
      <rect x="0" y="0" width="343" height="38" rx="6" fill="#080b12" stroke="#172030" stroke-width="1" />
      <text x="12" y="24" fill="#94a3b8" class="mono" font-size="11">PlantDocBot Diagnosis</text>
      <text x="248" y="24" fill="#00f5a0" class="mono" font-size="12" font-weight="700">95.2% ACC</text>
    </g>

    <!-- Metric Row 3: Entity Resolution -->
    <g transform="translate(16, 128)">
      <rect x="0" y="0" width="343" height="38" rx="6" fill="#080b12" stroke="#172030" stroke-width="1" />
      <text x="12" y="24" fill="#94a3b8" class="mono" font-size="11">Merchant Deduplication</text>
      <text x="240" y="24" fill="#00f5a0" class="mono" font-size="12" font-weight="700">&gt;99.1% RECALL</text>
    </g>

    <!-- Metric Row 4: Autonomous Agent -->
    <g transform="translate(16, 174)">
      <rect x="0" y="0" width="343" height="38" rx="6" fill="#080b12" stroke="#172030" stroke-width="1" />
      <text x="12" y="24" fill="#94a3b8" class="mono" font-size="11">Eylo MV3 Growth Agent</text>
      <text x="256" y="24" fill="#f59e0b" class="mono" font-size="12" font-weight="700">10x YIELD</text>
    </g>

    <!-- Telemetry Status Bar -->
    <g transform="translate(16, 230)">
      <text x="0" y="0" fill="#475569" class="mono" font-size="9.5">CORE MODELS: DINOv2 · FAISS · SPLADE · DISTILBERT</text>
    </g>
  </g>
</svg>
